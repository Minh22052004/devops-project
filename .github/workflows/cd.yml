# =============================================================================
# CD Pipeline - runs only when code is pushed/merged to main
# Purpose: build Docker images, push them to Docker Hub, then deploy
#
# ci.yml and cd.yml trigger independently. The branch protection rule (CI must
# pass before a PR can be merged) is what guarantees broken code never reaches
# main - and therefore never reaches this pipeline.
#
# Your tasks (see Lab 3 - publish images, and Lab 4 - deployment):
#   TODO 1  Log in to Docker Hub
#   TODO 2  Build and push the BACKEND image
#   TODO 3  Build and push the FRONTEND image
#   TODO 4  Deploy - choose ONE: Option A (SSH to a VPS) or Option B (Render)
#
# Repository settings (Settings > Secrets and variables > Actions):
#   Secrets   DOCKER_HUB_USERNAME        your Docker Hub username
#             DOCKER_HUB_TOKEN           Docker Hub access token (NOT your password)
#             SSH_HOST, SSH_USER, SSH_PRIVATE_KEY      Option A only
#             RENDER_DEPLOY_HOOK_BACKEND, RENDER_DEPLOY_HOOK_FRONTEND   Option B only
#   Variables BACKEND_URL                public URL of the backend, e.g.
#                                        http://<server-ip>:8080 or https://<name>.onrender.com
#                                        (a variable, not a secret: it is public and
#                                        is baked into the frontend bundle anyway)
# =============================================================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you start this workflow by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # -- STUDENT TODO 1: Log in to Docker Hub --------------------------------
      # Use docker/login-action@v4 with
      #   username: ${{ secrets.DOCKER_HUB_USERNAME }}
      #   password: ${{ secrets.DOCKER_HUB_TOKEN }}
      #
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # -- STUDENT TODO 2: Build and push the backend image ---------------------
      # Use docker/build-push-action@v7, context ./backend, push: true.
      # Tag with BOTH :latest and the commit SHA (${{ github.sha }}) so every
      # deployment can be traced and rolled back:
      #   <your-dockerhub-username>/bug-tracker-backend:latest
      #   <your-dockerhub-username>/bug-tracker-backend:${{ github.sha }}
      #
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-backend:${{ github.sha }}

      # -- STUDENT TODO 3: Build and push the frontend image --------------------
      # Same pattern, context ./frontend, image name bug-tracker-frontend.
      # REACT_APP_API_URL is baked into the JavaScript at BUILD time, so pass it
      # as a build argument:
      #   build-args: |
      #     REACT_APP_API_URL=${{ vars.BACKEND_URL }}
      #
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_API_URL=${{ vars.BACKEND_URL }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-frontend:${{ github.sha }}

  # ===========================================================================
  # OPTION A - Deploy to your own server via SSH
  # ===========================================================================
  # GitHub Actions -> SSH into the server -> docker compose pull -> up -d
  #
  # Pre-requisites on the server (Lab 4 - SSH):
  #   - Docker Engine + the docker compose plugin installed
  #   - the repository cloned to ~/app with a .env file next to docker-compose.yml
  #   - ports 3000 and 8080 open in the cloud firewall / security group
  #
  # Tip: the server .env holds IMAGE_TAG; write the new tag there before
  # `docker compose pull` so the server runs exactly the image just built.
  # ===========================================================================
  # deploy-ssh:
  #   name: "[Option A] Deploy to server via SSH"
  #   runs-on: ubuntu-latest
  #   needs: build-and-push
  #   timeout-minutes: 10

  #   steps:
  #     # -- STUDENT TODO 4A: Deploy via SSH --------------------------------------
  #     # Use appleboy/ssh-action@v1 with host/username/key from the secrets
  #     # SSH_HOST / SSH_USER / SSH_PRIVATE_KEY. Start the script with `set -e`
  #     # so the job fails if any command fails, then:
  #     #   cd ~/app
  #     #   git pull --ff-only origin main
  #     #   (update IMAGE_TAG in .env)
  #     #   docker compose -f docker-compose.yml pull
  #     #   docker compose -f docker-compose.yml up -d --no-build --remove-orphans
  #     #
  #     # Finish with a smoke test: curl -fsS "${{ vars.BACKEND_URL }}/health"
  #     - run: echo "Option A placeholder - replace this line with your SSH deploy step"

  # ===========================================================================
  # OPTION B - Deploy on Render (no SSH needed)
  # ===========================================================================
  # One-time setup in the Render dashboard (not in code):
  #   1. Create a PostgreSQL database; load database/database.sql into it.
  #   2. Create a Web Service for the backend from the Docker Hub image
  #      <user>/bug-tracker-backend:latest (port 8080) with the DB_* variables.
  #   3. Create a Web Service for the frontend from <user>/bug-tracker-frontend:latest
  #      (port 3000).
  #   4. Copy each service's Deploy Hook URL into the secrets
  #      RENDER_DEPLOY_HOOK_BACKEND / RENDER_DEPLOY_HOOK_FRONTEND.
  #
  # Render does not poll Docker Hub for new image tags; the deploy hook is how
  # CD tells Render to pull the new image (see Lab 4 - PaaS).
  #
  # STUDENT TODO 4B: uncomment and adapt (add `if: ...` or delete the job you
  # do not use - a job whose secret is missing will fail).
  #
  deploy-render:
    name: "[Option B] Trigger Render deploy"
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5
    steps:
      - name: Trigger backend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: curl -fsS -X POST "$HOOK_URL"
  
      - name: Trigger frontend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: curl -fsS -X POST "$HOOK_URL"
